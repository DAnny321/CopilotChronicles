title: "CopilotChronicles (Daniele Incalza)"
description: "The latest news from the world of Copilot: GitHub Copilot, Microsoft Copilot Studio, Microsoft 365 Copilot, Business Central Copilot, and Azure."
url: "https://DAnny321.github.io"
baseurl: "/CopilotChronicles"
lang: en

# --- Collezioni: un tema = una collezione, organizzate per anno-mese ---
collections:
  github-copilot:
    output: true
    permalink: /github-copilot/:year/:month/:title/
  copilot-studio:
    output: true
    permalink: /copilot-studio/:year/:month/:title/
  m365-copilot:
    output: true
    permalink: /m365-copilot/:year/:month/:title/
  business-central:
    output: true
    permalink: /business-central/:year/:month/:title/
  azure:
    output: true
    permalink: /azure/:year/:month/:title/

defaults:
  - scope:
      path: ""
      type: "github-copilot"
    values:
      layout: "post"
      theme_label: "GitHub Copilot"
  - scope:
      path: ""
      type: "copilot-studio"
    values:
      layout: "post"
      theme_label: "Copilot Studio"
  - scope:
      path: ""
      type: "m365-copilot"
    values:
      layout: "post"
      theme_label: "Microsoft 365 Copilot"
  - scope:
      path: ""
      type: "business-central"
    values:
      layout: "post"
      theme_label: "Business Central Copilot"
  - scope:
      path: ""
      type: "azure"
    values:
      layout: "post"
      theme_label: "Azure"

# GitHub Pages uses the native Jekyll build (Settings > Pages > Branch: main > Folder: / root)
markdown: kramdown
theme: minima
