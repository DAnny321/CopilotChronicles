---
layout: default
---
<article class="post">
  <header class="post-header">
    <span class="post-theme">{{ page.theme_label }}</span>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%d %B %Y" }}
      {% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}
    </p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  {% if page.source_url %}
  <p class="post-source">Original source: <a href="{{ page.source_url }}" target="_blank" rel="noopener">{{ page.source_name | default: page.source_url }}</a></p>
  {% endif %}
</article>
