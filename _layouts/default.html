<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/github-copilot/' | relative_url }}">GitHub Copilot</a>
      <a href="{{ '/copilot-studio/' | relative_url }}">Copilot Studio</a>
      <a href="{{ '/m365-copilot/' | relative_url }}">M365 Copilot</a>
      <a href="{{ '/business-central/' | relative_url }}">Business Central</a>
      <a href="{{ '/azure/' | relative_url }}">Azure</a>
    </nav>
  </header>
  <main class="page-content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>{{ site.title }} — built with Jekyll + GitHub Pages.</p>
  </footer>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false });
    var blocks = document.querySelectorAll('pre code.language-mermaid, code.language-mermaid');
    blocks.forEach(function (codeEl, i) {
      var container = codeEl.closest('div.language-mermaid') || codeEl.parentElement;
      var graphDefinition = codeEl.textContent;
      mermaid.render('mermaid-diagram-' + i, graphDefinition).then(function (result) {
        var wrapper = document.createElement('div');
        wrapper.className = 'mermaid-rendered';
        wrapper.innerHTML = result.svg;
        container.replaceWith(wrapper);
      });
    });
  </script>
</body>
</html>
